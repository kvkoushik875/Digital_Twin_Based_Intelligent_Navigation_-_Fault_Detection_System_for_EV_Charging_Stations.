[loggers]
keys=root,system,mqtt,model,digital_twin,navigation

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter

# ------------------------------------------------------------
# Root Logger
# ------------------------------------------------------------
[logger_root]
level=INFO
handlers=consoleHandler

# ------------------------------------------------------------
# System Logger
# ------------------------------------------------------------
[logger_system]
level=INFO
handlers=consoleHandler,fileHandler
qualname=system
propagate=0

# ------------------------------------------------------------
# MQTT Logger
# ------------------------------------------------------------
[logger_mqtt]
level=INFO
handlers=consoleHandler,fileHandler
qualname=mqtt
propagate=0

# ------------------------------------------------------------
# Model Training Logger
# ------------------------------------------------------------
[logger_model]
level=INFO
handlers=consoleHandler,fileHandler
qualname=model
propagate=0

# ------------------------------------------------------------
# Digital Twin Logger
# ------------------------------------------------------------
[logger_digital_twin]
level=INFO
handlers=consoleHandler,fileHandler
qualname=digital_twin
propagate=0

# ------------------------------------------------------------
# Navigation Logger
# ------------------------------------------------------------
[logger_navigation]
level=INFO
handlers=consoleHandler,fileHandler
qualname=navigation
propagate=0

# ------------------------------------------------------------
# Console Handler
# ------------------------------------------------------------
[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

# ------------------------------------------------------------
# File Handler (Rotating)
# ------------------------------------------------------------
[handler_fileHandler]
class=logging.handlers.RotatingFileHandler
level=INFO
formatter=simpleFormatter
args=("logs/system.log", "a", 1048576, 5)

# ------------------------------------------------------------
# Log Format
# ------------------------------------------------------------
[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
